name: Barq CI & Release Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-python:
    name: Test & Lint Python Application
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
        env:
          PYTHONPATH: src

  test-rust:
    name: Build & Test Rust Engine
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/**/Cargo.lock') }}

      - name: Build & Test Rust Workspace
        working-directory: engine
        run: |
          cargo build --workspace
          cargo test --workspace

  build-executables:
    name: Build Native Executables
    needs: [test-python, test-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pip install pyinstaller
          pyinstaller --clean --noconfirm build_executable.spec

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: barq-binary-${{ matrix.os }}
          path: dist/*
