name: Barq CI & Release Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-python:
    name: Test & Lint Python Application
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Configure Qt for headless tests
        shell: bash
        run: |
          QT_PLUGINS="$(python - <<'PY'
          from PyQt6.QtCore import QLibraryInfo

          print(
              QLibraryInfo.path(
                  QLibraryInfo.LibraryPath.PluginsPath
              )
          )
          PY
          )"

          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM_PLUGIN_PATH=${QT_PLUGINS}" >> "$GITHUB_ENV"

          echo "Qt plugin root: ${QT_PLUGINS}"
          ls -la "${QT_PLUGINS}/platforms" || dir "${QT_PLUGINS}/platforms"

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"
        env:
          PYTHONPATH: src

  test-rust:
    name: Build & Test Rust Engine
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/**/Cargo.lock') }}

      - name: Build & Test Rust Workspace
        working-directory: engine
        run: |
          cargo build --locked --workspace
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test-native-host:
    name: Build & Test Browser Native Host
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Test Native Host
        working-directory: apps/native-host
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings

  test-browser-integration:
    name: Test Browser Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked browser dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check protocol and browser capture core
        run: |
          pnpm --filter @barq/protocol typecheck
          pnpm --filter @barq/browser-core typecheck
          pnpm --filter @barq/extension typecheck

      - name: Test protocol, browser core, and extension
        run: |
          pnpm --filter @barq/protocol test
          pnpm --filter @barq/browser-core test
          pnpm --filter @barq/extension test

      - name: Build Chrome and Firefox extensions
        run: |
          pnpm --filter @barq/extension build
          pnpm --filter @barq/extension build:firefox

      - name: Validate extension builds
        run: node scripts/validate-extension-build.mjs

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: barq-chrome-extension
          path: apps/extension/.output/chrome-mv3/

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: barq-firefox-extension
          path: apps/extension/.output/firefox-mv3/

  build-executables:
    name: Build Native Executables
    needs: [test-python, test-rust, test-native-host, test-browser-integration]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pip install pyinstaller
          pyinstaller --clean --noconfirm build_executable.spec

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: barq-binary-${{ matrix.os }}
          path: dist/*
